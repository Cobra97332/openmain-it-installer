name: CloudPanel NetBird Installer CI

on:
  push:
    paths:
      - "cloudpanel-netbird/**"
      - ".github/workflows/cloudpanel-netbird-ci.yml"
  pull_request:
    paths:
      - "cloudpanel-netbird/**"
      - ".github/workflows/cloudpanel-netbird-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bash-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate installer Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n cloudpanel-netbird/install.sh
          echo "Bash syntax OK"

      - name: Check NGINX configuration heredoc markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q "^NGINX$" cloudpanel-netbird/install.sh
          grep -q "proxy_pass https://127.0.0.1:8443;" cloudpanel-netbird/install.sh
          grep -q "proxy_pass https://127.0.0.1:443;" cloudpanel-netbird/install.sh
          grep -q "nginx -t" cloudpanel-netbird/install.sh
          echo "Required NGINX bridge directives present"

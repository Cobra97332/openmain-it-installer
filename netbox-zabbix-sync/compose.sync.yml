services:
  netbox-sync:
    image: python:3.12-alpine
    restart: unless-stopped
    network_mode: "service:netbird"
    depends_on:
      netbird:
        condition: service_started
      netbox:
        condition: service_healthy
    env_file:
      - ./env/sync.env
    # The embedded NetBird reverse-proxy peer, NOT the management server.
    # /etc/hosts is container-specific even with network_mode: service:netbird.
    # This preserves the HTTPS hostname for SNI and certificate validation.
    extra_hosts:
      - "zabbix.openmain-it.de:100.107.239.95"
    command: ["python", "-u", "/app/sync.py"]
    volumes:
      - ./netbox-sync/sync.py:/app/sync.py:ro
    security_opt:
      - no-new-privileges:true

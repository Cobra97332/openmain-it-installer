services:
  netbox-sync:
    image: python:3.12-alpine
    restart: unless-stopped
    network_mode: "service:netbird"
    depends_on:
      netbird:
        condition: service_started
      netbox:
        condition: service_healthy
    env_file:
      - ./env/sync.env
    # Connect to the reverse-proxy peer inside sync.py while preserving TLS SNI.
    # Docker forbids extra_hosts with network_mode: service:netbird.
    command: ["python", "-u", "/app/sync.py"]
    volumes:
      - ./netbox-sync:/app:ro
    security_opt:
      - no-new-privileges:true

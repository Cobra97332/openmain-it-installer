name: NetBird Prometheus CI

on:
  push:
    paths:
      - 'netbird-prometheus/**'
      - '.github/workflows/netbird-prometheus-ci.yml'
  pull_request:
    paths:
      - 'netbird-prometheus/**'
      - '.github/workflows/netbird-prometheus-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bash syntax
        run: |
          bash -n netbird-prometheus/install.sh
          bash -n netbird-prometheus/enable-server-metrics.sh
          bash -n netbird-prometheus/enable-client-metrics.sh
          bash -n netbird-prometheus/inspect-metrics.sh

      - name: Python syntax
        run: |
          python3 -m py_compile netbird-prometheus/add-client-target.py
          python3 -m py_compile netbird-prometheus/normalize-dashboards.py

      - name: Validate client metrics safety model
        run: |
          grep -F '127.0.0.1' netbird-prometheus/enable-client-metrics.sh
          grep -F 'systemd-socket-proxyd' netbird-prometheus/enable-client-metrics.sh
          grep -F 'FreeBind=yes' netbird-prometheus/enable-client-metrics.sh
          grep -F 'ListenStream=$NETBIRD_IP:$METRICS_PORT' netbird-prometheus/enable-client-metrics.sh
          ! grep -F -- '--local-metrics-address "$NETBIRD_IP:$METRICS_PORT"'             netbird-prometheus/enable-client-metrics.sh

      - name: Test client target helper
        run: |
          printf '[]\n' > /tmp/netbird-clients.json
          python3 netbird-prometheus/add-client-target.py \
            --file /tmp/netbird-clients.json \
            100.64.10.20 test-gateway customer-a
          python3 netbird-prometheus/add-client-target.py \
            --file /tmp/netbird-clients.json \
            100.64.10.21 internal-host
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("/tmp/netbird-clients.json").read_text())
          assert data == [
              {
                  "targets": ["100.64.10.20:9191"],
                  "labels": {"host": "test-gateway", "customer": "customer-a"},
              },
              {
                  "targets": ["100.64.10.21:9191"],
                  "labels": {"host": "internal-host", "customer": "intern"},
              },
          ], data
          print("client target helper OK")
          PY

      - name: Validate pinned NetBird dashboards
        run: |
          ref="$(sed -n 's/^NETBIRD_REF=.*:-\([^}]*\)}.*/\1/p' netbird-prometheus/install.sh | head -1)"
          test -n "$ref"
          mkdir -p /tmp/netbird-dashboards
          for dashboard in management signal relay client; do
            curl -fsSL               "https://raw.githubusercontent.com/netbirdio/netbird/$ref/infrastructure_files/observability/grafana/dashboards/$dashboard.json"               -o "/tmp/netbird-dashboards/$dashboard.json"
          done

          python3 netbird-prometheus/normalize-dashboards.py \
            /tmp/netbird-dashboards \
            --rate-interval 2m

          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("/tmp/netbird-dashboards")
          expected = {"management.json", "signal.json", "relay.json", "client.json"}
          files = {p.name for p in root.glob("*.json")}
          assert files == expected, files

          for path in root.glob("*.json"):
              text = path.read_text()
              data = json.loads(text)
              assert data.get("title"), path
              assert data.get("uid"), path
              assert "$__rate_interval" not in text, path
              assert "$interval" not in text, path

              if path.name == "client.json":
                  variables_by_name = {
                      v.get("name"): v
                      for v in data.get("templating", {}).get("list", [])
                  }
                  assert set(variables_by_name) == {"datasource", "customer", "host"}
                  assert variables_by_name["customer"]["label"] == "Kunde"
                  assert variables_by_name["host"]["label"] == "Host"
                  client_repr = repr(data)
                  assert 'customer=~"$customer"' in client_repr
                  assert 'host=~"$host"' in client_repr
                  assert 'instance=~"$instance"' not in client_repr
                  assert 'job=~"$job"' not in client_repr

                  client_panels = {}
                  def index_client_panels(value):
                      if isinstance(value, list):
                          for item in value:
                              index_client_panels(item)
                      elif isinstance(value, dict):
                          title = value.get("title")
                          if title:
                              client_panels[title] = value
                          for item in value.values():
                              index_client_panels(item)
                  index_client_panels(data)

                  for title in (
                      "Management connected",
                      "Signal connected",
                      "Known peers",
                      "Connected peers",
                      "P2P peers",
                      "Relay peers",
                  ):
                      assert title in client_panels, title
                      assert client_panels[title]["gridPos"]["w"] == 4, title

                  assert 'connection_type="p2p"' in client_panels["P2P peers"]["targets"][0]["expr"]
                  assert 'connection_type="relay"' in client_panels["Relay peers"]["targets"][0]["expr"]
                  assert client_panels["Management connected"]["fieldConfig"]["defaults"]["mappings"]
                  assert "directly connected P2P peers" in client_panels["Peer latency"]["description"]

              if path.name == "management.json":
                  for stale in (
                      "management_grpc_sync_request_counter_ratio_total",
                      "management_grpc_login_request_counter_ratio_total",
                      "management_grpc_key_request_counter_ratio_total",
                      "management_grpc_sync_request_duration_ms_bucket",
                      "management_grpc_login_request_duration_ms_bucket",
                      "management_http_request_duration_ms_bucket",
                      "management_updatechannel_create_duration_micro_bucket",
                      "management_account_network_map_object_count_bucket",
                  ):
                      assert stale not in text, stale

                  for expected_metric in (
                      "management_grpc_sync_request_counter_total",
                      "management_grpc_login_request_counter_total",
                      "management_grpc_key_request_counter_total",
                      "management_grpc_sync_request_duration_ms_milliseconds_bucket",
                      "management_grpc_login_request_duration_ms_milliseconds_bucket",
                      "management_http_request_duration_ms_milliseconds_bucket",
                      "management_updatechannel_create_duration_micro_microseconds_bucket",
                      "management_account_network_map_object_count_objects_bucket",
                  ):
                      assert expected_metric in text, expected_metric

                  connected = []
                  def walk(value):
                      if isinstance(value, list):
                          for item in value:
                              walk(item)
                      elif isinstance(value, dict):
                          if value.get("title") == "Connected peers":
                              connected.append(value)
                          for item in value.values():
                              walk(item)
                  walk(data)
                  assert len(connected) == 1, len(connected)
                  panel = connected[0]
                  defaults = panel["fieldConfig"]["defaults"]
                  assert defaults["unit"] == "none"
                  assert defaults["decimals"] == 0
                  assert panel["options"]["showPercentChange"] is False

                  panels = {}
                  def index_panels(value):
                      if isinstance(value, list):
                          for item in value:
                              index_panels(item)
                      elif isinstance(value, dict):
                          title = value.get("title")
                          if title:
                              panels[title] = value
                          for item in value.values():
                              index_panels(item)
                  index_panels(data)

                  operations = panels["Update Channel operations"]
                  assert operations["type"] == "timeseries"
                  assert operations["fieldConfig"]["defaults"]["custom"]["drawStyle"] == "bars"

                  recreated = panels["Percentage of Recreated channels"]
                  assert len(recreated["targets"]) == 1
                  assert recreated["targets"][0]["datasource"]["type"] == "prometheus"
                  assert "closed=\"true\"" in recreated["targets"][0]["expr"]
                  assert "clamp_min" in recreated["targets"][0]["expr"]

                  queue = panels["Update Channel queue observations (1h)"]
                  assert queue["type"] == "stat"
                  assert "management_grpc_updatechannel_queue_length_count" in queue["targets"][0]["expr"]
                  assert "or vector(0)" in queue["targets"][0]["expr"]

              variables = data.get("templating", {}).get("list", [])
              assert any(v.get("type") == "datasource" and v.get("query") == "prometheus" for v in variables), path

          print("official NetBird dashboards normalized OK")
          PY

      - name: Prometheus config syntax
        run: |
          cat > /tmp/prometheus.yml <<'EOF'
          global:
            scrape_interval: 30s
            scrape_timeout: 10s
            evaluation_interval: 30s

          scrape_configs:
            - job_name: netbird-server
              static_configs:
                - targets:
                    - "100.64.10.10:9090"
                  labels:
                    cluster: "openmain"
                    environment: "prod"
                    host: "netbird-server"
              metric_relabel_configs:
                - source_labels: [__name__]
                  regex: 'management_.*'
                  target_label: application
                  replacement: 'management'
                - source_labels: [__name__]
                  regex: 'signal_.*'
                  target_label: application
                  replacement: 'signal'
                - source_labels: [__name__]
                  regex: 'signal_(.*)'
                  target_label: __name__
                  replacement: '$1'

            - job_name: netbird-client
              file_sd_configs:
                - files:
                    - /etc/prometheus/targets/netbird-clients.json
                  refresh_interval: 30s
          EOF

          docker run --rm             --entrypoint /bin/promtool             -v /tmp/prometheus.yml:/etc/prometheus/prometheus.yml:ro             prom/prometheus:v3.15.0             check config /etc/prometheus/prometheus.yml

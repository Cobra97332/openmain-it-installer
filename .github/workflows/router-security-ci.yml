name: Router platform and security tests

on:
  push:
    paths:
      - 'router-install.sh'
      - 'zabbix-*.sh'
      - 'firstboot-router.sh'
      - 'netbird-router/**'
      - 'netbird-prometheus/sync-client-targets.py'
      - 'netbird-prometheus/enable-client*.sh'
      - 'tests/**'
      - 'build-iso.sh'
      - 'preseed.cfg'
      - 'openmain-router-firstboot.service'
      - 'grafana-zabbix/install*.sh'
      - '.github/workflows/router-security-ci.yml'
  pull_request:
    paths:
      - 'router-install.sh'
      - 'zabbix-*.sh'
      - 'firstboot-router.sh'
      - 'netbird-router/**'
      - 'netbird-prometheus/sync-client-targets.py'
      - 'netbird-prometheus/enable-client*.sh'
      - 'tests/**'
      - 'build-iso.sh'
      - 'preseed.cfg'
      - 'openmain-router-firstboot.service'
      - 'grafana-zabbix/install*.sh'
      - '.github/workflows/router-security-ci.yml'

permissions:
  contents: read

jobs:
  offline-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install static analysis tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq gnupg
      - name: Syntax, ShellCheck and offline mocks
        run: bash tests/check-router.sh
      - name: Build Debian 13 test environment
        if: ${{ !cancelled() }}
        run: docker build -f tests/Dockerfile.router -t openmain-router-test:debian13 .
      - name: Debian 13 offline regression tests
        if: ${{ !cancelled() }}
        run: docker run --rm --network none -v "$PWD:/src:ro" openmain-router-test:debian13
      - name: Debian 13 bootstrap with jq absent
        if: ${{ !cancelled() }}
        run: |
          docker run --rm --network none -v "$PWD:/src:ro" openmain-router-test:debian13 bash -c \
            'dpkg --remove jq >/dev/null && ! command -v jq && python3 -m unittest discover -s tests -p test_router_bootstrap.py -v'
      - name: Experimental single-owner snapshot kernel tests (no installer integration)
        if: ${{ !cancelled() }}
        run: >-
          docker run --rm --network none --cap-add NET_ADMIN
          --sysctl net.ipv4.ip_forward=1 -e OPENMAIN_ISOLATED_TEST=1
          -v "$PWD:/src:ro" openmain-router-test:debian13 python3 tests/nft_native_snapshot_kernel.py
      - name: Isolated real nftables packet and rollback tests
        if: ${{ !cancelled() }}
        run: >-
          docker run --rm --network none --cap-add NET_ADMIN
          --sysctl net.ipv4.ip_forward=1 -e OPENMAIN_ISOLATED_TEST=1
          -v "$PWD:/src:ro" openmain-router-test:debian13 python3 tests/nft_kernel.py

      - name: Pinned native NetBird publisher, Engine/ACL build, ARM64 and kernel tests
        if: ${{ !cancelled() }}
        run: bash tests/check-native-binat-patch.sh

      - name: Small native ACL integration (separate patch; all earlier security gates retained)
        if: ${{ !cancelled() }}
        run: bash tests/check-native-binat-patch.sh small

      - name: Build isolated real NetBird lab tools
        if: ${{ !cancelled() }}
        run: >-
          docker build -f netbird-router/experimental/native-binat/docker-lab/Dockerfile.tools
          -t openmain-native-lab-tools:debian13 .
      - name: Real version-pinned controller TLS, bootstrap and API contract (no client proof)
        if: ${{ !cancelled() }}
        run: |
          docker pull netbirdio/netbird-server:0.80.0@sha256:05b3d8d6d056e5062a2965d4d6e5d6d83f09f2bf9133947a8e5972e0e0e7a261
          OPENMAIN_ISOLATED_TEST=1 python3 netbird-router/experimental/native-binat/docker-lab/lab.py \
            --controller-only --report "$RUNNER_TEMP/native-controller.json"
      - name: Build actual patched NetBird v0.80.0 CLI and Engine
        if: ${{ !cancelled() }}
        run: >-
          docker build -f netbird-router/experimental/native-binat/docker-lab/Dockerfile.client
          -t openmain-native-lab-client:0.80.0-small .
      - name: Mandatory real client integration and packet gates (incomplete gates block release)
        if: ${{ !cancelled() }}
        run: >-
          OPENMAIN_ISOLATED_TEST=1 python3 netbird-router/experimental/native-binat/docker-lab/lab.py
          --report "$RUNNER_TEMP/native-clients.json"
      - name: Preserve sanitized real-lab reports only
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-lab-reports-${{ github.event_name }}
          path: ${{ runner.temp }}/native-*.json
          if-no-files-found: error

  platform-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build QEMU lab tools
        run: docker build -f tests/Dockerfile.platform-lab -t openmain-platform-lab:debian13 .
      - name: Prepare Debian 13 lab roots (Debian package mirrors only)
        run: |
          mkdir -p "$RUNNER_TEMP/openmain-platform-lab"
          docker run --rm -v "$RUNNER_TEMP/openmain-platform-lab:/lab" openmain-platform-lab:debian13 \
            debootstrap --variant=minbase \
            --include=systemd-sysv,kmod,procps,python3,jq,nftables,iproute2,ifupdown,curl,gnupg,shellcheck,ca-certificates \
            trixie /lab/amd64 http://deb.debian.org/debian
          docker run --rm -v "$RUNNER_TEMP/openmain-platform-lab:/lab" openmain-platform-lab:debian13 \
            debootstrap --foreign --arch=arm64 --variant=minbase --include=python3,jq \
            trixie /lab/arm64 http://deb.debian.org/debian
      - name: Build native TUN-lifetime fixture (all security counterexamples remain mandatory)
        if: ${{ !cancelled() }}
        env:
          OPENMAIN_NATIVE_DRIVER_EXPORT: ${{ runner.temp }}/openmain-platform-lab/small-native-lab
        run: |
          docker build -f tests/Dockerfile.router -t openmain-router-test:debian13 .
          bash tests/check-native-binat-patch.sh small
      - name: Actual QEMU VM and synthetic ISO BIOS/UEFI boots (offline APIs)
        if: ${{ !cancelled() }}
        run: >-
          docker run --rm --network none -e OPENMAIN_ISOLATED_TEST=1
          -v "$RUNNER_TEMP/openmain-platform-lab:/lab" -v "$PWD:/src:ro"
          openmain-platform-lab:debian13 python3 tests/qemu_platforms.py --native-small /lab/small-native-lab
      - name: Actual ARM64 Python with simulated router APIs
        if: ${{ !cancelled() }}
        run: >-
          docker run --rm --network none -e OPENMAIN_ISOLATED_TEST=1
          -v "$RUNNER_TEMP/openmain-platform-lab:/lab" -v "$PWD:/src:ro"
          openmain-platform-lab:debian13 python3 tests/arm64_platforms.py

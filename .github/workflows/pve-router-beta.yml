name: PVE router beta gates

on:
  push:
    branches:
      - beta-pve-qnap-legacy-router
    paths:
      - router-install.sh
      - netbird-router/pve/**
      - tests/pve_binat_policy_kernel.py
      - tests/Dockerfile.pve-binat-policy
      - .github/workflows/pve-router-beta.yml

permissions:
  contents: read

jobs:
  syntax-and-unsafe-binat-refusal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          bash -n router-install.sh
          bash -n netbird-router/pve/install.sh
          bash -n zabbix-proxy-install.sh
          bash -n zabbix-api-register.sh
      - name: BINAT and direct routing must fail before enrollment
        run: |
          docker build -f tests/Dockerfile.pve-binat-policy -t pve-router-beta .
          docker run --rm --network none -v "$PWD:/src:ro" pve-router-beta bash -ec '
            set +e
            expect_reject() {
              pattern=$1; shift
              output=$("$@" 2>&1)
              result=$?
              if [ "$result" -eq 0 ]; then printf "Unexpected success: %s\n" "$*"; exit 1; fi
              printf "%s\n" "$output" | grep -F "$pattern" || exit 1
            }
            expect_reject "PVE-LXC-BINAT gesperrt" bash router-install.sh --routing-mode binat --customer Fixture --setup-key unused --api-token unused
            expect_reject "Ausschließlich BINAT" bash router-install.sh --routing-mode native --customer Fixture --setup-key unused --api-token unused
            expect_reject "PVE-LXC-BINAT gesperrt" bash netbird-router/pve/install.sh --routing-mode binat
            expect_reject "Ausschließlich BINAT" bash netbird-router/pve/install.sh --routing-mode native
          '

  policy-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated Debian 13 lab
        run: docker build -f tests/Dockerfile.pve-binat-policy -t pve-router-beta .
      - name: Allow, deny, revoke, established and reply packet gates
        run: >-
          docker run --rm --network none --cap-add NET_ADMIN --cap-add NET_RAW
          --sysctl net.ipv4.ip_forward=1 -e OPENMAIN_ISOLATED_TEST=1
          -v "$PWD:/src:ro" pve-router-beta python3 tests/pve_binat_policy_kernel.py

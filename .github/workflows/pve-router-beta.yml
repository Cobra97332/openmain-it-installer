name: PVE BINAT functional installer

on:
  push:
    branches:
      - beta-pve-qnap-legacy-router
    paths:
      - router-install.sh
      - zabbix-*.sh
      - netbird-router/**
      - tests/**
      - .github/workflows/pve-router-beta.yml

permissions:
  contents: read

jobs:
  pve-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          bash -n router-install.sh
          bash -n netbird-router/pve/install.sh
          bash -n zabbix-proxy-install.sh
          bash -n zabbix-api-register.sh
      - name: Debian 13 isolated installer regressions
        run: |
          docker build -f tests/Dockerfile.router -t pve-binat-beta:debian13 .
          docker run --rm --network none -v "$PWD:/src:ro" pve-binat-beta:debian13 \
            python3 -m unittest discover -s tests -p 'test_router_entrypoints.py' -v
      - name: Customer network, staff group and BINAT policy regressions
        run: |
          docker run --rm --network none -v "$PWD:/src:ro" pve-binat-beta:debian13 \
            env PYTHONPATH=tests python3 -m unittest -v \
          test_router_platforms.NetworkTests \
          test_router_platforms.RuntimeTests \
          test_router_platforms.ZabbixHostTests


      - name: Router group membership and retry regressions
        run: >-
          docker run --rm --network none -v "$PWD:/src:ro" pve-binat-beta:debian13
          python3 -m unittest discover -s tests -p 'test_router_security.py' -v

      - name: BINAT ACL reconciliation unit regressions
        run: >-
          docker run --rm --network none -v "$PWD:/src:ro" pve-binat-beta:debian13
          python3 -m unittest discover -s tests -p 'test_binat_acl.py' -v
      - name: Zabbix TLS-PSK and registration offline regressions
        run: >-
          docker run --rm --network none -v "$PWD:/src:ro" pve-binat-beta:debian13
          python3 -m unittest discover -s tests -p 'test_router_zabbix*.py' -v

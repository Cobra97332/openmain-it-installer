#_preseed_V1
d-i debian-installer/locale string de_DE.UTF-8
d-i keyboard-configuration/xkb-keymap select de
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string netbird-router
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i passwd/root-login boolean true
d-i passwd/root-password-crypted password *
d-i passwd/make-user boolean true
d-i passwd/user-fullname string OpenMain IT Administrator
d-i passwd/username string omadmin
d-i passwd/user-password-crypted password *
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Berlin
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string openssh-server curl ca-certificates sudo nftables jq python3 iproute2
d-i finish-install/reboot_in_progress note
d-i preseed/late_command string cp /cdrom/openmain-installer/firstboot-router.sh /target/usr/local/sbin/netbird-router-firstboot; cp /cdrom/openmain-installer/openmain-router-firstboot.service /target/etc/systemd/system/openmain-router-firstboot.service; chmod 0755 /target/usr/local/sbin/netbird-router-firstboot; in-target systemctl enable openmain-router-firstboot.service; in-target systemctl enable ssh.service; in-target sh -c 'echo net.ipv4.ip_forward=1 > /etc/sysctl.d/99-netbird-router.conf'

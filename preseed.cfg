#_preseed_V1
d-i debian-installer/locale string de_DE.UTF-8
d-i keyboard-configuration/xkb-keymap select de
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string netbird-router
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
# Account credentials are requested by Debian Installer; never baked into media.
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Berlin
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman/confirm boolean false
d-i partman/confirm_nooverwrite boolean false
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string openssh-server curl ca-certificates sudo nftables jq python3 iproute2
d-i finish-install/reboot_in_progress note
# Disk selection/formatting requires the installer's confirmation.
d-i preseed/late_command string set -e; in-target mkdir -p /opt/openmain-router; cp -a /cdrom/openmain-installer/. /target/opt/openmain-router/; in-target chmod 0755 /opt/openmain-router/firstboot-router.sh; cp /cdrom/openmain-installer/openmain-router-firstboot.service /target/etc/systemd/system/openmain-router-firstboot.service; in-target systemctl enable openmain-router-firstboot.service

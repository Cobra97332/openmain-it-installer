name: NetBird Prometheus CI

on:
  push:
    paths:
      - 'netbird-prometheus/**'
      - 'router-install.sh'
      - 'firstboot-router.sh'
      - 'netbird-router/**'
      - '.github/workflows/netbird-prometheus-ci.yml'
  pull_request:
    paths:
      - 'netbird-prometheus/**'
      - 'router-install.sh'
      - 'firstboot-router.sh'
      - 'netbird-router/**'
      - '.github/workflows/netbird-prometheus-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bash syntax
        run: |
          bash -n netbird-prometheus/install.sh
          bash -n netbird-prometheus/enable-server-metrics.sh
          bash -n netbird-prometheus/enable-client-metrics.sh
          bash -n netbird-prometheus/inspect-metrics.sh
          bash -n router-install.sh
          bash -n firstboot-router.sh
          bash -n netbird-router/pve/install.sh
          bash -n netbird-router/pve/install-no-zabbix.sh
          bash -n netbird-router/raspberry-pi/install-router.sh

      - name: Python syntax
        run: |
          python3 -m py_compile netbird-prometheus/add-client-target.py
          python3 -m py_compile netbird-prometheus/normalize-dashboards.py
          python3 -m py_compile netbird-prometheus/generate-overview-dashboard.py
          python3 -m py_compile netbird-prometheus/generate-relay-connections-dashboard.py
          python3 -m py_compile netbird-prometheus/netbird-status-exporter.py
          python3 -m py_compile netbird-prometheus/sync-client-targets.py

      - name: PowerShell syntax
        shell: pwsh
        run: |
          foreach ($file in @(
            "netbird-prometheus/enable-client-metrics.ps1",
            "netbird-prometheus/netbird-status-exporter.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ($file + ": " + $_.Message) }
              exit 1
            }
          }

      - name: Validate Windows client metrics safety model
        run: |
          grep -F '127.0.0.1:$MetricsPort' netbird-prometheus/enable-client-metrics.ps1
          grep -F 'netsh interface portproxy add v4tov4' netbird-prometheus/enable-client-metrics.ps1
          grep -F -- '-LocalAddress $ListenAddress' netbird-prometheus/enable-client-metrics.ps1
          grep -F -- '-RemoteAddress $RemoteAddress' netbird-prometheus/enable-client-metrics.ps1
          grep -F 'Monitoring -> NetBird-Metrics TCP/$MetricsPort,$DetailPort' netbird-prometheus/enable-client-metrics.ps1
          grep -F 'OpenMain NetBird Status Exporter' netbird-prometheus/enable-client-metrics.ps1
          grep -F '127.0.0.1:$DetailPort' netbird-prometheus/enable-client-metrics.ps1
          ! grep -F -- '--local-metrics-address "$netBirdIp' netbird-prometheus/enable-client-metrics.ps1

      - name: Validate client metrics safety model
        run: |
          grep -F '127.0.0.1' netbird-prometheus/enable-client-metrics.sh
          grep -F 'systemd-socket-proxyd' netbird-prometheus/enable-client-metrics.sh
          grep -F 'FreeBind=yes' netbird-prometheus/enable-client-metrics.sh
          grep -F 'ListenStream=$NETBIRD_IP:$METRICS_PORT' netbird-prometheus/enable-client-metrics.sh
          grep -F 'ListenStream=$NETBIRD_IP:$DETAIL_PORT' netbird-prometheus/enable-client-metrics.sh
          grep -F 'netbird-status-exporter.py' netbird-prometheus/enable-client-metrics.sh
          grep -F '127.0.0.1:$DETAIL_PORT' netbird-prometheus/enable-client-metrics.sh
          ! grep -F -- '--local-metrics-address "$NETBIRD_IP:$METRICS_PORT"' netbird-prometheus/enable-client-metrics.sh

      - name: Validate automatic rollout integration
        run: |
          grep -F -- '--enable-local-metrics' router-install.sh
          grep -F -- '--local-metrics-address "127.0.0.1:$METRICS_PORT"' router-install.sh
          grep -F 'METRICS_GROUP="${NB_METRICS_GROUP:-NetBird-Metrics}"' router-install.sh
          grep -F 'METRICS_DETAIL_PORT="${NB_METRICS_DETAIL_PORT:-9192}"' router-install.sh
          grep -F 'ensure_setup_key_metrics_group' router-install.sh
          grep -F 'ensure_metrics_policy' router-install.sh
          grep -F 'openmain-netbird-client-metrics' router-install.sh
          grep -F 'NB_METRICS_ENABLED' firstboot-router.sh
          grep -F 'NB_METRICS_ENABLED' netbird-router/pve/install.sh
          grep -F 'NB_METRICS_ENABLED' netbird-router/pve/install-no-zabbix.sh
          grep -F 'NB_METRICS_ENABLED' netbird-router/raspberry-pi/install-router.sh
          grep -F 'ports:[$port,$detail_port]' router-install.sh

      - name: Test NetBird API target rendering
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path("netbird-prometheus/sync-client-targets.py")
          spec = importlib.util.spec_from_file_location("sync_client_targets", path)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          peers = [
              {
                  "id": "peer-a",
                  "ip": "100.64.10.20",
                  "hostname": "pbsterramaster",
                  "groups": [
                      {"name": "All"},
                      {"name": "Kunden"},
                      {"name": "Bauer"},
                      {"name": "NetBird-Metrics"},
                  ],
              },
              {
                  "id": "peer-b",
                  "ip": "100.64.10.21",
                  "hostname": "pc-intern",
                  "groups": [
                      {"name": "All"},
                      {"name": "NetBird-Metrics"},
                  ],
              },
              {
                  "id": "peer-c",
                  "ip": "100.64.10.22",
                  "hostname": "not-monitored",
                  "groups": [{"name": "All"}],
              },
          ]

          targets = mod.make_auto_targets(
              peers,
              "NetBird-Metrics",
              "Monitoring",
              9191,
              "intern",
              mod.DEFAULT_IGNORE_GROUPS,
          )

          assert targets == [
              {
                  "targets": ["100.64.10.20:9191"],
                  "labels": {
                      "host": "pbsterramaster",
                      "customer": "Bauer",
                      "managed_by": "netbird-api",
                      "peer_id": "peer-a",
                  },
              },
              {
                  "targets": ["100.64.10.21:9191"],
                  "labels": {
                      "host": "pc-intern",
                      "customer": "intern",
                      "managed_by": "netbird-api",
                      "peer_id": "peer-b",
                  },
              },
          ], targets

          existing = [{
              "targets": ["100.64.10.20:9191"],
              "labels": {"host": "manual-pbs", "customer": "intern"},
          }]
          merged = mod.merge_targets(existing, targets)
          assert len(merged) == 2, merged
          assert not any(item["labels"].get("host") == "manual-pbs" for item in merged)
          assert any(
              item["labels"].get("host") == "pbsterramaster"
              and item["labels"].get("managed_by") == "netbird-api"
              for item in merged
          )
          assert any(item["labels"].get("host") == "pc-intern" for item in merged)
          print("NetBird target rendering OK")
          PY

      - name: Test detailed NetBird status exporter rendering
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path("netbird-prometheus/netbird-status-exporter.py")
          spec = importlib.util.spec_from_file_location("nb_status_exporter", path)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          mod.netbird_status = lambda _: {
              "peers": {
                  "details": [
                      {
                          "fqdn": "peer-relay.example",
                          "netbirdIp": "100.64.20.2",
                          "status": "Connected",
                          "connectionType": "Relayed",
                          "relayAddress": "rels://relay.example:443",
                          "transferReceived": 1234,
                          "transferSent": 5678,
                          "lastWireguardHandshake": "2026-10-08T10:00:00Z",
                      },
                      {
                          "fqdn": "peer-p2p.example",
                          "netbirdIp": "100.64.20.3",
                          "status": "Connected",
                          "connectionType": "P2P",
                          "relayAddress": "",
                          "transferReceived": 10,
                          "transferSent": 20,
                          "lastWireguardHandshake": "2026-10-08T10:00:00Z",
                      },
                  ]
              }
          }

          text = mod.render_metrics("netbird")
          assert 'peer="peer-relay.example"' in text
          assert 'connection_type="relay"' in text
          assert 'relay_address="rels://relay.example:443"' in text
          assert 'peer="peer-p2p.example"' in text
          assert 'connection_type="p2p"' in text
          assert "openmain_netbird_relay_peer_relations 1" in text
          assert "openmain_netbird_connected_peer_relations 2" in text
          print("detailed status exporter rendering OK")
          PY
      - name: Validate auto-discovery systemd units
        run: |
          grep -F 'EnvironmentFile=/etc/openmain-netbird-prometheus.env' netbird-prometheus/systemd/openmain-netbird-target-sync.service
          grep -F 'ExecStart=/usr/local/sbin/openmain-netbird-sync-targets' netbird-prometheus/systemd/openmain-netbird-target-sync.service
          grep -F 'OnUnitActiveSec=60s' netbird-prometheus/systemd/openmain-netbird-target-sync.timer
          grep -F 'openmain-netbird-target-sync.timer' netbird-prometheus/install.sh
      - name: Test client target helper
        run: |
          printf '[]\n' > /tmp/netbird-clients.json
          python3 netbird-prometheus/add-client-target.py \
            --file /tmp/netbird-clients.json \
            100.64.10.20 test-gateway customer-a
          python3 netbird-prometheus/add-client-target.py \
            --file /tmp/netbird-clients.json \
            100.64.10.21 internal-host
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("/tmp/netbird-clients.json").read_text())
          assert data == [
              {
                  "targets": ["100.64.10.20:9191"],
                  "labels": {"host": "test-gateway", "customer": "customer-a"},
              },
              {
                  "targets": ["100.64.10.21:9191"],
                  "labels": {"host": "internal-host", "customer": "intern"},
              },
          ], data
          print("client target helper OK")
          PY

      - name: Validate pinned NetBird dashboards
        run: |
          ref="$(sed -n 's/^NETBIRD_REF=.*:-\([^}]*\)}.*/\1/p' netbird-prometheus/install.sh | head -1)"
          test -n "$ref"
          mkdir -p /tmp/netbird-dashboards
          for dashboard in management signal relay client; do
            curl -fsSL               "https://raw.githubusercontent.com/netbirdio/netbird/$ref/infrastructure_files/observability/grafana/dashboards/$dashboard.json"               -o "/tmp/netbird-dashboards/$dashboard.json"
          done

          python3 netbird-prometheus/normalize-dashboards.py \
            /tmp/netbird-dashboards \
            --rate-interval 2m

          python3 netbird-prometheus/generate-overview-dashboard.py \
            /tmp/netbird-dashboards/overview.json

          python3 netbird-prometheus/generate-relay-connections-dashboard.py \
            /tmp/netbird-dashboards/relay-connections.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("/tmp/netbird-dashboards")
          expected = {"management.json", "signal.json", "relay.json", "client.json", "overview.json", "relay-connections.json"}
          files = {p.name for p in root.glob("*.json")}
          assert files == expected, files

          for path in root.glob("*.json"):
              text = path.read_text()
              data = json.loads(text)
              assert data.get("title"), path
              assert data.get("uid"), path
              assert "$__rate_interval" not in text, path
              assert "$interval" not in text, path

              if path.name == "client.json":
                  variables_by_name = {
                      v.get("name"): v
                      for v in data.get("templating", {}).get("list", [])
                  }
                  assert set(variables_by_name) == {"datasource", "customer", "host"}
                  assert variables_by_name["customer"]["label"] == "Kunde"
                  assert variables_by_name["host"]["label"] == "Host"
                  client_repr = repr(data)
                  assert 'customer=~"$customer"' in client_repr
                  assert 'host=~"$host"' in client_repr
                  assert 'instance=~"$instance"' not in client_repr
                  assert 'job=~"$job"' not in client_repr

                  client_panels = {}
                  def index_client_panels(value):
                      if isinstance(value, list):
                          for item in value:
                              index_client_panels(item)
                      elif isinstance(value, dict):
                          title = value.get("title")
                          if title:
                              client_panels[title] = value
                          for item in value.values():
                              index_client_panels(item)
                  index_client_panels(data)

                  for title in (
                      "Management connected",
                      "Signal connected",
                      "Known peers",
                      "Connected peers",
                      "P2P peers",
                      "Relay peers",
                  ):
                      assert title in client_panels, title
                      assert client_panels[title]["gridPos"]["w"] == 4, title

                  assert 'connection_type="p2p"' in client_panels["P2P peers"]["targets"][0]["expr"]
                  assert 'connection_type="relay"' in client_panels["Relay peers"]["targets"][0]["expr"]
                  assert client_panels["Management connected"]["fieldConfig"]["defaults"]["mappings"]
                  assert client_panels["Management connected"]["targets"][0]["instant"] is True
                  assert client_panels["Management connected"]["targets"][0]["range"] is False
                  assert client_panels["Management connected"]["targets"][0]["expr"].startswith("max(")
                  assert client_panels["Known peers"]["targets"][0]["expr"].startswith("max(")
                  assert client_panels["P2P peers"]["targets"][0]["expr"].startswith("max(")
                  assert client_panels["Relay peers"]["targets"][0]["expr"].startswith("max(")
                  assert "directly connected P2P peers" in client_panels["Peer latency"]["description"]

              if path.name == "overview.json":
                  assert data["uid"] == "openmain-netbird-overview"
                  assert data["title"] == "NetBird / Overview"
                  assert data["refresh"] == "30s"
                  assert data["time"] == {"from": "now-2d", "to": "now"}
                  assert "$__rate_interval" not in text
                  assert "$interval" not in text

                  variables_by_name = {
                      v.get("name"): v
                      for v in data.get("templating", {}).get("list", [])
                  }
                  assert set(variables_by_name) == {"datasource", "customer", "host"}
                  assert variables_by_name["customer"]["includeAll"] is True
                  assert variables_by_name["host"]["includeAll"] is True

                  overview_panels = {}
                  def index_overview_panels(value):
                      if isinstance(value, list):
                          for item in value:
                              index_overview_panels(item)
                      elif isinstance(value, dict):
                          title = value.get("title")
                          if title:
                              overview_panels[title] = value
                          for item in value.values():
                              index_overview_panels(item)
                  index_overview_panels(data)

                  for title in (
                      "Clients online",
                      "Clients offline",
                      "Management verbunden",
                      "Signal verbunden",
                      "P2P Verbindungen",
                      "Relay Verbindungen",
                      "P2P Anteil",
                      "Relay Traffic",
                      "P2P Latenz",
                      "Verbindungstypen",
                      "Überwachte Clients je Kunde",
                      "Top P2P Latenzen",
                      "Client Status",
                  ):
                      assert title in overview_panels, title

                  assert 'connection_type="p2p"' in repr(overview_panels["P2P Verbindungen"])
                  assert 'connection_type="relay"' in repr(overview_panels["Relay Verbindungen"])
                  assert 'relay_transfer_received_bytes_total' in repr(overview_panels["Relay Traffic"])
                  assert 'relay_transfer_sent_bytes_total' in repr(overview_panels["Relay Traffic"])
                  assert 'netbird_peer_latency_seconds' in repr(overview_panels["P2P Latenz"])
                  assert overview_panels["Client Status"]["type"] == "table"

              if path.name == "relay-connections.json":
                  assert data["uid"] == "openmain-netbird-relay-connections"
                  assert data["title"] == "NetBird / Relay Connections"
                  assert data["refresh"] == "30s"
                  variables_by_name = {
                      v.get("name"): v
                      for v in data.get("templating", {}).get("list", [])
                  }
                  assert set(variables_by_name) == {"datasource", "customer", "source"}

                  relay_panels = {}
                  def index_relay_panels(value):
                      if isinstance(value, list):
                          for item in value:
                              index_relay_panels(item)
                      elif isinstance(value, dict):
                          title = value.get("title")
                          if title:
                              relay_panels[title] = value
                          for item in value.values():
                              index_relay_panels(item)
                  index_relay_panels(data)

                  for title in (
                      "Relay-Beziehungen",
                      "Clients mit Relay",
                      "Ziel-Peers über Relay",
                      "Verwendete Relay-Server",
                      "Aktuelle Relay-Verbindungen – wer mit wem",
                      "Relay-Verbindungen nach Quelle",
                      "Relay-Verbindungen nach Relay-Server",
                      "Relay Traffic gesendet",
                      "Relay Traffic empfangen",
                  ):
                      assert title in relay_panels, title

                  relay_repr = repr(data)
                  assert "openmain_netbird_peer_connection_info" in relay_repr
                  assert 'connection_type="relay"' in relay_repr
                  assert "relay_address" in relay_repr
                  assert 'job="netbird-client-detail"' in relay_repr
                  assert relay_panels["Aktuelle Relay-Verbindungen – wer mit wem"]["type"] == "table"
              if path.name == "management.json":
                  for stale in (
                      "management_grpc_sync_request_counter_ratio_total",
                      "management_grpc_login_request_counter_ratio_total",
                      "management_grpc_key_request_counter_ratio_total",
                      "management_grpc_sync_request_duration_ms_bucket",
                      "management_grpc_login_request_duration_ms_bucket",
                      "management_http_request_duration_ms_bucket",
                      "management_updatechannel_create_duration_micro_bucket",
                      "management_account_network_map_object_count_bucket",
                  ):
                      assert stale not in text, stale

                  for expected_metric in (
                      "management_grpc_sync_request_counter_total",
                      "management_grpc_login_request_counter_total",
                      "management_grpc_key_request_counter_total",
                      "management_grpc_sync_request_duration_ms_milliseconds_bucket",
                      "management_grpc_login_request_duration_ms_milliseconds_bucket",
                      "management_http_request_duration_ms_milliseconds_bucket",
                      "management_updatechannel_create_duration_micro_microseconds_bucket",
                      "management_account_network_map_object_count_objects_bucket",
                  ):
                      assert expected_metric in text, expected_metric

                  connected = []
                  def walk(value):
                      if isinstance(value, list):
                          for item in value:
                              walk(item)
                      elif isinstance(value, dict):
                          if value.get("title") == "Connected peers":
                              connected.append(value)
                          for item in value.values():
                              walk(item)
                  walk(data)
                  assert len(connected) == 1, len(connected)
                  panel = connected[0]
                  defaults = panel["fieldConfig"]["defaults"]
                  assert defaults["unit"] == "none"
                  assert defaults["decimals"] == 0
                  assert panel["options"]["showPercentChange"] is False

                  panels = {}
                  def index_panels(value):
                      if isinstance(value, list):
                          for item in value:
                              index_panels(item)
                      elif isinstance(value, dict):
                          title = value.get("title")
                          if title:
                              panels[title] = value
                          for item in value.values():
                              index_panels(item)
                  index_panels(data)

                  operations = panels["Update Channel operations"]
                  assert operations["type"] == "timeseries"
                  assert operations["fieldConfig"]["defaults"]["custom"]["drawStyle"] == "bars"

                  recreated = panels["Percentage of Recreated channels"]
                  assert len(recreated["targets"]) == 1
                  assert recreated["targets"][0]["datasource"]["type"] == "prometheus"
                  assert "closed=\"true\"" in recreated["targets"][0]["expr"]
                  assert "clamp_min" in recreated["targets"][0]["expr"]

                  queue = panels["Update Channel queue observations (1h)"]
                  assert queue["type"] == "stat"
                  assert "management_grpc_updatechannel_queue_length_count" in queue["targets"][0]["expr"]
                  assert "or vector(0)" in queue["targets"][0]["expr"]

              variables = data.get("templating", {}).get("list", [])
              assert any(v.get("type") == "datasource" and v.get("query") == "prometheus" for v in variables), path

          print("official NetBird dashboards normalized OK")
          PY

      - name: Prometheus config syntax
        run: |
          cat > /tmp/prometheus.yml <<'EOF'
          global:
            scrape_interval: 30s
            scrape_timeout: 10s
            evaluation_interval: 30s

          scrape_configs:
            - job_name: netbird-server
              static_configs:
                - targets:
                    - "100.64.10.10:9090"
                  labels:
                    cluster: "openmain"
                    environment: "prod"
                    host: "netbird-server"
              metric_relabel_configs:
                - source_labels: [__name__]
                  regex: 'management_.*'
                  target_label: application
                  replacement: 'management'
                - source_labels: [__name__]
                  regex: 'signal_.*'
                  target_label: application
                  replacement: 'signal'
                - source_labels: [__name__]
                  regex: 'signal_(.*)'
                  target_label: __name__
                  replacement: '$1'

            - job_name: netbird-client
              file_sd_configs:
                - files:
                    - /etc/prometheus/targets/netbird-clients.json
                  refresh_interval: 30s
          EOF

          docker run --rm             --entrypoint /bin/promtool             -v /tmp/prometheus.yml:/etc/prometheus/prometheus.yml:ro             prom/prometheus:v3.15.0             check config /etc/prometheus/prometheus.yml

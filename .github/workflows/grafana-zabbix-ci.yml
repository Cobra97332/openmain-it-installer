name: Grafana Zabbix CI

on:
  push:
    paths:
      - 'grafana-zabbix/**'
      - '.github/workflows/grafana-zabbix-ci.yml'
  pull_request:
    paths:
      - 'grafana-zabbix/**'
      - '.github/workflows/grafana-zabbix-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python syntax
        run: |
          python3 -m py_compile \
            grafana-zabbix/generate-dashboards.py \
            grafana-zabbix/sync-zabbix-groups.py \
            grafana-zabbix/inspect-zabbix-host.py

      - name: Bash syntax
        run: |
          bash -n grafana-zabbix/install.sh
          bash -n grafana-zabbix/install-docker.sh

      - name: Generate dashboards
        run: |
          rm -rf /tmp/openmain-dashboards
          python3 grafana-zabbix/generate-dashboards.py \
            --datasource-uid ci-zabbix \
            --output /tmp/openmain-dashboards

      - name: Validate dashboard JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("/tmp/openmain-dashboards")
          files = sorted(root.glob("*.json"))
          expected = {
              "opnsense.json",
              "pve.json",
              "idrac.json",
              "nas.json",
              "qnap.json",
              "synology.json",
              "netbird.json",
              "customers.json",
              "problems.json",
              "tv.json",
          }

          assert {p.name for p in files} == expected, [p.name for p in files]
          assert len(files) == 10, [p.name for p in files]

          uids = set()
          for path in files:
              data = json.loads(path.read_text(encoding="utf-8"))
              assert data["title"].startswith("OpenMain - "), path
              assert data["uid"] not in uids, data["uid"]
              assert data["panels"], path
              uids.add(data["uid"])

              encoded = json.dumps(data)
              assert "ci-zabbix" in encoded, f"Datasource UID fehlt in {path}"

          opn = json.loads((root / "opnsense.json").read_text(encoding="utf-8"))
          variable_names = [v.get("name") for v in opn.get("templating", {}).get("list", [])]
          assert variable_names == ["group", "host", "interface"], variable_names
          panel_titles = {p.get("title") for p in opn.get("panels", [])}
          for title in {
              "Packet Filter",
              "State Table - Auslastung",
              "Interface - Traffic RX / TX",
              "Interface - IPv4/IPv6 Traffic blocked",
              "Interface - Errors / Discards",
          }:
              assert title in panel_titles, (title, sorted(panel_titles))

          print(f"OK: {len(files)} Dashboards, {len(uids)} eindeutige UIDs")
          PY
